[tool.poetry]
name = "tgov-scraper"
version = "0.1.0"
description = "A set of scripts and notebooks for exploring Tulsa Government Access Television"
authors = [
    "jdungan <johnadungan@gmail.com>",
    "groovecoder <luke@groovecoder.com>",
]
readme = "README.md"
packages = [{ include = "src" }, { include = "db" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
selectolax = "^0.3.28"
aiohttp = "^3.11.13"
pytest-asyncio = "^0.25.3"
pydantic = "^2.10.6"
matplotlib = "^3.10.1"
ipykernel = "^6.29.5"
pandas = "^2.2.3"
ipywidgets = "^8.1.5"
tqdm = "^4.67.1"
m3u8 = "^6.0.0"
requests = "^2.32.3"
pydub = "^0.25.1"
moviepy = "^2.1.2"
jupyter = "^1.1.1"
jupyter-nbextensions-configurator = "^0.6.4"
python-dotenv = "^1.0.1"
aiofiles = "^24.1.0"
faster-whisper = "^1.1.0"
prefect = "^3.3.0"
boto3 = "^1.37.24"
dyntastic = "^0.18.0"
langchain-community = "^0.3.21"
openai = "^1.70.0"
pypdf = "^5.4.0"
tiktoken = "^0.9.0"
whisperx = "^3.3.1"
google-genai = "^1.9.0"
dateparser = "^1.2.1"
langchain-community = "^0.3.21"
openai = "^1.70.0"
pypdf = "^5.4.0"
tiktoken = "^0.9.0"
whisperx = "^3.3.1"


[tool.poetry.group.dev.dependencies]
ipdb = "^0.13.13"
ipykernel = "^6.29.5"
jupyter = "^1.1.1"
nbstripout = "^0.8.1"
pre-commit = "^4.2.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
